[project]
name = "hijack-proof-agent"
version = "0.1.0"
description = "Hardening a small local LLM agent against indirect prompt injection, measured on AgentDojo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentdojo==0.1.35",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
# AgentDojo's prompt-injection classifier, one of the comparison defences
pi-detector = ["torch", "transformers"]
# Local backend on Apple silicon (evals/round.sh without server URLs); not used for the reported runs
mlx = ["mlx-lm; sys_platform == 'darwin'", "mlx-vlm; sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest",
 "ruff",
]

[tool.uv]
package = false
# The exact versions behind the reported runs (requirements.lock, whose hash each results/*/env.json records)
