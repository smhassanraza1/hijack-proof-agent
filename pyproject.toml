[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["results", "kaggle"]

[tool.ruff.lint]
# Errors only: the agent code stays exactly as it ran, and AgentDojo's pipeline interface needs
# mutable default arguments.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
